[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmfold"
version = "0.1.0"
description = "Analis data otonom untuk usaha kecil: unggah data, terima notebook, laporan, dan data bersih."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "scipy>=1.13",
  "openpyxl>=3.1",
  "pyarrow>=16",
  "jupyter_client>=8.6",
  "ipykernel>=6.29",
  "nbformat>=5.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/swarmfold/api.py" = ["B008"]  # File()/Form() adalah pola FastAPI
