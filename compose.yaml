services:
  app:
    build:
      context: .
      args:
        # `SWARMFOLD_BUILD_SHA=$(git rev-parse --short HEAD) docker compose build`
        BUILD_SHA: "${SWARMFOLD_BUILD_SHA:-dev}"
    image: swarmfold:local
    # Loopback saja: tanpa autentikasi, port yang terbuka ke LAN berarti siapa
    # pun di jaringan bisa mengunduh dataset klien lewat /api/runs/{id}/paket.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # Harus sama dengan mount di bawah. Default `./runs` di config.py berarti
      # /app/runs di dalam container, jadi artefak run tidak pernah sampai ke
      # host dan hilang begitu container di-recreate.
      SWARMFOLD_DATA_ROOT: /runs
      # Nama image dicatat `provenance.json`; build_sha masuk lewat build arg.
      SWARMFOLD_IMAGE: swarmfold:local
    volumes:
      - ./runs:/runs
      - ./inbox:/inbox:ro
    # Satu cell yang boros tidak boleh memakan memori/PID host.
    mem_limit: 4g
    pids_limit: 256
    cpus: 2.0
    restart: unless-stopped
